schema_version = 1
catalog = "powermise-profiles"
catalog_revision = "2"

# MCP servers powermise can add to an agent. A server is a program mise
# installs and runs (`tool`, `version`, `command`) or a remote server (`url`).
# powermise writes them into each agent's own config file with a mise
# dotfiles merge entry, so mise owns only those keys.
#
# `category = "services"` marks a company's own hosted server for its
# product. Each one's address comes from the company's entry in the official
# MCP Registry (registry.modelcontextprotocol.io), published under a
# namespace that company verified it owns (`com.stripe/…`, or
# `io.github.<their org>/…`). They sign in with OAuth in the agent, so no
# keys go in any file. Popular, widely used services only: anything else can
# be added with Add Server.

[[mcp_servers]]
id = "context7"
title = "Context7"
description = "Up-to-date, version-specific documentation and code examples for the libraries you use."
homepage = "https://github.com/upstash/context7"
tool = "npm:@upstash/context7-mcp"
version = "4.4.2"
command = "context7-mcp"

