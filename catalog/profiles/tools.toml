# Provider versions pinned 2026-08-31 against upstream channels (mise
# ls-remote, Homebrew, npm, winget-pkgs manifests, Scoop manifests).
# Exception: `bootstrap-apt` providers install the distribution's own package
# version, so they deliberately stay on the distro channel.
