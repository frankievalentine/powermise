name: Release

# Builds the desktop app for macOS, Linux, and Windows on GitHub's runners
# when a version tag is pushed (`git tag v0.2.0 && git push origin v0.2.0`),
# and attaches the installers to a draft GitHub release to review and publish.
# Files get stable names (powermise-macos-universal.dmg, …) so
# /releases/latest/download/<name> — which the site's download button and
# install scripts use — always points at the newest published release.
#
# Linux builds use Ubuntu 22.04 so they run on older distributions too.
#
# Builds are unsigned for now: macOS gets an ad-hoc signature (so it runs on
# Apple Silicon), Windows none. Bump the version first with
# scripts/bump-version.sh; the tag must match it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag to build again, like v0.2.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check the tag matches the app's version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG but tauri.conf.json says $version. Run scripts/bump-version.sh first."
            exit 1
          fi

      # Install steps and first-launch help for unsigned builds
      # (.github/release-notes.md), ahead of GitHub's generated notes.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --generate-notes \
              --notes-file .github/release-notes.md --title "powermise ${TAG#v}"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux x64
            runner: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            args: --bundles appimage,deb,rpm
          - name: Windows
            runner: windows-latest
            args: --bundles nsis,msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/desktop
        # Signs the in-app update files (.sig) with the updater key.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build ${{ matrix.args }}

      - name: Name the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          bundle=$(find apps/desktop/src-tauri/target -type d -path '*release/bundle' | head -n1)
          case "$RUNNER_OS" in
            macOS)
              cp "$(find "$bundle/dmg" -name '*.dmg' | head -n1)" release/powermise-macos-universal.dmg
              # The in-app update: the app as a .tar.gz, and its signature.
              cp "$(find "$bundle/macos" -name '*.app.tar.gz' | head -n1)" release/powermise-macos-universal.app.tar.gz
              cp "$(find "$bundle/macos" -name '*.app.tar.gz.sig' | head -n1)" release/powermise-macos-universal.app.tar.gz.sig
              ;;
            Linux)
              arch=$(uname -m)
              deb_arch=$([ "$arch" = aarch64 ] && echo arm64 || echo amd64)
              cp "$(find "$bundle/appimage" -name '*.AppImage' | head -n1)" "release/powermise-linux-$arch.AppImage"
              cp "$(find "$bundle/appimage" -name '*.AppImage.sig' | head -n1)" "release/powermise-linux-$arch.AppImage.sig"
              cp "$(find "$bundle/deb" -name '*.deb' | head -n1)" "release/powermise-linux-$deb_arch.deb"
              cp "$(find "$bundle/rpm" -name '*.rpm' | head -n1)" "release/powermise-linux-$arch.rpm"
              ;;
            Windows)
              cp "$(find "$bundle/nsis" -name '*-setup.exe' | head -n1)" release/powermise-windows-x64-setup.exe
              cp "$(find "$bundle/nsis" -name '*-setup.exe.sig' | head -n1)" release/powermise-windows-x64-setup.exe.sig
              cp "$(find "$bundle/msi" -name '*.msi' | head -n1)" release/powermise-windows-x64.msi
              ;;
          esac
          ls -l release

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/* --clobber

  checksums:
    name: Checksums and update manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS and latest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --pattern 'powermise-*'
          sha256sum powermise-* > SHA256SUMS
          cat SHA256SUMS
          # The manifest the app's updater reads (plugins.updater in
          # tauri.conf.json): each platform's update file and signature.
          python3 - "$TAG" "$GH_REPO" <<'PY'
          import json, sys, datetime, pathlib
          tag, repo = sys.argv[1], sys.argv[2]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          def entry(name):
              return {"signature": pathlib.Path(f"{name}.sig").read_text().strip(), "url": f"{base}/{name}"}
          mac = entry("powermise-macos-universal.app.tar.gz")
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "linux-x86_64": entry("powermise-linux-x86_64.AppImage"),
                  "linux-aarch64": entry("powermise-linux-aarch64.AppImage"),
                  "windows-x86_64": entry("powermise-windows-x64-setup.exe"),
              },
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$TAG" SHA256SUMS latest.json --clobber
